name: Tests

# Runs pytest on pushes to master, on pull requests and when docker.yml calls it.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # docker.yml calls this workflow and builds the image only if it passes.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install psycopg2-binary

      # Tests marked live need a Trino at 127.0.0.1:8081 and are deselected here.
      - name: Run tests
        run: pytest tests/ -q -m "not live"
