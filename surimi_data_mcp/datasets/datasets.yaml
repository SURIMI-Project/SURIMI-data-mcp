    energy-cost-to-revenue share read 168.5 percent in 2013 and 85.2 percent in 2015, which is confident nonsense
    and not a real cost share. Use the implied_fuel_price / energy_cost_share metrics over v-fuel-price-by-country-year
    (aer-economic-national-level) for Greek fuel cost numbers instead.'
