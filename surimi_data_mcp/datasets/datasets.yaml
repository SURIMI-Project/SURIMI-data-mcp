  # Replaces eu-dcf-rev-grp. That table came from AUTH's Rev_GRP.csv, which has one row per AER variable (a long file) and was registered as a wide one.
  # SUM(revenue) over it returned total income and not the gross value of landings.
  # This entry is built from the AER source AUTH used, with one row per fleet segment and year and every measure named.
  # scripts/build_fleet_economics.py reconciles it against AUTH's published indicator and fails the build on any mismatch.
- id: eu-dcf-fleet-economics
  name: EU DCF Fleet economics (income, costs, profit)
  kind: observed
  domain: eu_dcf
  table: hive.eu_dcf.fleet_economics
  time_column: year
  warning: 4,733 of the 12,022 fleet segment-years report NO economic variable at all. Those carry NULL,
    not 0, so they stay out of SUM and out of any ranking. A fleet showing no profit value has not reported
    one; it has not broken even.
  not_a_substitute_for: '''revenue'' is ambiguous in this domain and this table does not guess. landings_value
    is the gross value of landings, the value a fisher calls revenue. total_income adds other income, quota
    leasing income and operating subsidies. Naming which one an answer used is the difference between 14.46
    bn and 14.90 bn EUR for Italy over 2008-2024. Likewise gross_profit follows STECF and includes subsidies,
    while gross_profit_excl_subsidies_and_rights narrows income to landings plus other income, which is
    the basis AUTH''s published Rev_GRP indicator uses.'
  # Income components (AER: Income group): landings_value, other_income, rights_income,
  # operating_subsidies.
  # Cost components (AER: Expenditure group): energy_cost, repair_cost, other_variable_cost,
  # other_nonvariable_cost, rights_cost, personnel_cost, unpaid_labour_value, depreciation.
  # Derived, per STECF's 2024 Annual Economic Report: total_income, gva, gross_profit,
  # gross_profit_excl_subsidies_and_rights, net_profit.
  columns:
    - {name: country_name, type: string}
    - {name: country_code, type: string}
    - {name: year, type: bigint}
    - {name: supra_reg, type: string}
    - {name: fishing_tech, type: string}
    - {name: vessel_length, type: string}
    - {name: geo_indicator, type: string}
    - {name: landings_value, type: double, additivity: flow}
    - {name: other_income, type: double, additivity: flow}
    - {name: rights_income, type: double, additivity: flow}
    - {name: operating_subsidies, type: double, additivity: flow}
    - {name: energy_cost, type: double, additivity: flow}
    - {name: repair_cost, type: double, additivity: flow}
    - {name: other_variable_cost, type: double, additivity: flow}
    - {name: other_nonvariable_cost, type: double, additivity: flow}
    - {name: rights_cost, type: double, additivity: flow}
    - {name: personnel_cost, type: double, additivity: flow}
    - {name: unpaid_labour_value, type: double, additivity: flow}
    - {name: depreciation, type: double, additivity: flow}
    - {name: total_income, type: double, additivity: flow}
    - {name: gva, type: double, additivity: flow}
    - {name: gross_profit, type: double, additivity: flow}
    - {name: gross_profit_excl_subsidies_and_rights, type: double, additivity: flow}
    - {name: net_profit, type: double, additivity: flow}

  # This table is cube-only. The file is 1.9 GB, so loader/load_csv.py does not load it into Postgres (tests/test_catalog_additions.py checks this).
  # Its measure columns carry the confidentiality placeholder C instead of a number (see warning below).
- id: eu-dcf-catches
  # The file's README gives the meaning of the placeholder: "confidential data are not shown, the placeholder C is used instead".
  warning: 'CONFIDENTIAL DATA IS WITHHELD, SO EVERY TOTAL HERE IS A LOWER BOUND. Member States suppress
    values at country level and the file writes the placeholder C where the value belongs. C is NOT a zero
    and it is loaded as NULL, so SUM silently skips those rows. Measured over 400,000 rows: the confidential
    column reads A (all withheld) on 142,404 rows, 35.6 per cent, V (value withheld) on 6,321, and N (nothing
    withheld) on 251,275. So a national landings total omits more than a third of the rows that matched.
    aggregate returns a per-measure suppressed count on every result: state the total AND that count, and
    never present the number as complete. Separately, tot_discards_tonnes is NA on about half the rows,
    meaning not applicable rather than withheld, and the README warns discard estimates are uncertain and
    possibly biased.'
  name: EU DCF FDI Catches by Country, Quarter, Gear and Species (2013-2024; confidentiality-suppressed
    rows carry "C" in total_live_weight_landed, total_value_of_landings and tot_discards_tonnes)
  kind: observed
  domain: eu_dcf
  table: hive.eu_dcf.eu_dcf_catches
  time_column: year
  not_a_substitute_for: 'Measure columns (total_live_weight_landed, total_value_of_landings, tot_discards_tonnes)
    carry the literal string "C" wherever a row is confidentiality-suppressed (see the ''confidential''
    column): 330,212 of 501,244 Spanish DTS rows carry it, and every tonnage here is a floor over the visible
    rows, never a complete national count. Use aggregate for totals here: it treats the "C" rows as NULL
    and reports how many were suppressed. In query_data write the cast as CAST(NULLIF(col, ''C'') AS double
    precision), which both the database and the cube accept. This table holds observed catch only, 2013-2024;
    it carries no climate-linked projection and no forward scenario.'
  columns:
    - {name: country, type: string}
    - {name: year, type: int}
    - {name: quarter, type: string}
    - {name: vessel_length, type: string}
    - {name: fishing_tech, type: string}
    - {name: gear_type, type: string}
    - {name: target_assemblage, type: string}
    - {name: mesh_size_range, type: string}
    - {name: metier, type: string}
    - {name: metier_7, type: string}
    - {name: domain_discards, type: string}
    - {name: domain_landings, type: string}
    - {name: supra_region, type: string}
    - {name: sub_region, type: string}
    - {name: eez_indicator, type: string}
    - {name: geo_indicator, type: string}
    - {name: nep_sub_region, type: string}
    - {name: specon_tech, type: string}
    - {name: deep, type: string}
