- id: surimi-biomass-wmed-empirical
  not_a_substitute_for: 'This is an observed SURVEY of biomass, 60 rows over 5 species. It is NOT a stock
    assessment: it carries no reference point, so B/Bmsy, F/Fmsy and Kobe status cannot be derived from
    it. Those are CMSY++ output and are not served. Summing biomass_kt across species does not make a
    stock trajectory. cv_uncertainty is this survey''s coefficient of variation, NOT the uncertainty of
    a stock status.'
  citation: SURIMI project empirical biomass survey, Western Mediterranean (GSA06/07).
  name: SURIMI Empirical Biomass Surveys, Western Mediterranean
  kind: observed
  domain: surimi
  table: hive.surimi.surimi_empirical_biomass_surveys_western_mediterranean
  time_column: year
  columns:
    - {name: year, type: int}
    - {name: species_code, type: string}
    - {name: biomass_kt, type: float, additivity: stock}
    - {name: cv_uncertainty, type: float, additivity: ratio}

  # Registered wide, as the source file ships. The loader names the year columns y_1994 to y_2021.
  # fao_division carries the sub-basin code ('37.3.1' is the Aegean, '37.1.x' the west, '37.3.x' the east),
  # and fao_subarea ('37.1' or '37.3') separates west from east, so species can be listed per side with GROUP BY scient_name.
  # The col column is the unnamed first field of the raw header.
- id: surimi-biomass-medits
  not_a_substitute_for: 'This is trawl-survey catch-per-unit-effort (species weight per km2 of swept area
    for one haul), NOT an assessed stock biomass: it carries no reference point, and it must not be presented
    as ''biomass'' without saying it is a survey CPUE index. The source README states the unit as tonnes
    per km2; the raw values are actually kg per km2 (checked against CMSY++''s own kg/km2 index for the
    same GSA06 stocks). Do not requote the README''s unit without this correction. There is no ''small demersal'' or any other functional-group column: a group has to
    be built by selecting specific alpha3_code / scient_name values (see data_list_functional_groups), and
    a single outlier species can flip the sign of a naive group average, so check the per-species series
    before reporting a group trend.'
  name: SURIMI MEDITS Bottom-Trawl Survey CPUE, Mediterranean (FAO Area 37), by species and year, 1994-2021
  citation: 'MEDITS Working Group (2017) MEDITS-Handbook. Version n. 9, 2017. MEDITS Project, 106 pp. DOI:
    https://doi.org/10.25607/OBP-1931'
  kind: observed
  domain: surimi
  table: hive.surimi.medits_survey_cpue_mediterranean
  time_column: null
  columns:
    - {name: col, type: string}
    - {name: scient_name, type: string}
    - {name: taxonomic_code, type: string}
    - {name: alpha3_code, type: string}
    - {name: common_name, type: string}
    - {name: gsa_area, type: string, description: 'GFCM Geographical Sub-Area number, e.g. ''15'' for Malta. The finest region key this table carries.'}
    - {name: fao_area, type: string}
    - {name: fao_subarea, type: string}
    - {name: fao_division_description, type: string}
    - {name: fao_division, type: string}
    - {name: haul_number, type: string, description: MEDITS haul identifier. The swept-area denominator for this row's CPUE was already applied per haul upstream; it is not a separate column here.}
    - {name: lon_end, type: float, additivity: ratio}
    - {name: lat_end, type: float, additivity: ratio}
    - {name: y_1994, type: float, additivity: ratio}
    - {name: y_1995, type: float, additivity: ratio}
