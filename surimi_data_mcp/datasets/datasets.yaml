- id: fishbase-sealifebase-traits
  not_a_substitute_for: 'This is per-SPECIES trait data (FishBase/SeaLifeBase), not an environmental time
    series: min_temperature, max_temperature and mean_temperature describe the thermal range a species is
    typically found in, not what the sea temperature actually was in any place or month. It can support
    a community temperature index (a trait-weighted mean over an observed community''s species), but only
    alongside real observation data that supplies the community composition (e.g. MEDITS CPUE); read alone
    it answers ''where does this species live'', never ''what did the sea do''. SURIMI holds no Mediterranean
    sea-temperature or primary-productivity time series anywhere; this table is the nearest material, not
    a substitute for one.'
  name: FishBase / SeaLifeBase Species Traits (thermal range, trophic level, resilience)
  citation: 'Froese, R. and Pauly, D. (editors). 2025. FishBase. Available at www.fishbase.org. Palomares,
    M.L.D. and Pauly, D. (eds). 2025. SeaLifeBase. Available at www.sealifebase.org. Licence: CC-BY-NC.'
  kind: observed
  domain: ecological
  table: hive.ecological.fishbase_sealifebase_traits
  time_column: null
  columns:
    - {name: scient_name, type: string}
    - {name: alpha3_code, type: string}
    - {name: taxonomic_code, type: string}
    - {name: prior_r_value, type: string}
    - {name: cl_lower, type: string}
    - {name: cl_upper, type: string}
    - {name: resilience, type: string}
    - {name: trophic_level, type: string}
    - {name: trophic_level_se, type: string}
    - {name: min_temperature, type: string}
    - {name: max_temperature, type: string}
    - {name: mean_temperature, type: string}
    - {name: habitat, type: string}
    - {name: broader_habitat, type: string}
    - {name: source_url, type: string}

- id: surimi-sales-aegean-simulated
  not_a_substitute_for: 'This is SIMULATED SALES, not catch. quantity_kt is the quantity SOLD: it excludes
    discards entirely and is a market outcome, not a fishing one. Do NOT answer a question about catches,
    landings or production from it, and do not treat its 2025-2040 span as a catch projection, because no catch
    projection has been produced. OBSERVED catch-family data IS served and this warning does not apply to
    it: fisheries-landings holds landings in tonnes live weight (for example 31,079 Belgian rows, 1904-2022),
    so use that for what WAS caught. What is missing is a FORWARD projection; modelled catch output stops
    at a hindcast ending 2017-01 on the model server. The calculation record shows that the number was computed
    from these rows, and it does not show that these rows answer the question asked. THE NAME DOES NOT MATCH
    THE ROWS: the market codes are Spanish (ESAQA, ESARN, ESBCN), not Greek or Aegean, and nothing in the
    lake ties this table to a SURIMI run, so do not present it as an Aegean or Greek result.'
  name: SURIMI Simulated Sales Output, Aegean Sea
  kind: modelled
  domain: surimi
  table: hive.surimi.surimi_simulated_sales_output_aegean_sea
  time_column: year
  columns:
    - {name: year, type: int}
    - {name: market_code, type: string}
    - {name: species_code, type: string}
    - {name: quantity_kt, type: float, additivity: flow}
    - {name: price_eur_per_kg, type: float, additivity: ratio}
    - {name: value_meur, type: float, additivity: flow}

