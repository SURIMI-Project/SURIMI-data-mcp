  # The most recent assessment per stock: 21,077 rows over 538 stocks, one row per stock-year.
- id: ices-stock-assessment-latest
  name: ICES Stock Database - latest assessment per stock, full time series, all Northeast Atlantic stocks
  # list_datasets shows scope_note and does not show not_a_substitute_for, so scope_note names the questions this table answers.
  scope_note: 'Answers Northeast Atlantic stock-status questions: whether a stock is overfished or depleted
    (stock_size below blim), in the red zone (stock_size below blim, or fishing_pressure above flim), fished
    above fmsy, and how SSB and F changed over the years. A catch compatible with MSY can be approximated
    as fmsy x stock_size; call it an approximation. Not for the Mediterranean: Western Mediterranean stock
    status is on the MODEL server, model_run_stock_status.'
  citation: ICES Stock Database, https://stockdatabase.ices.dk/default.aspx, all stocks and all available
    years, downloaded and merged by the SURIMI data team; see the source README.
  kind: observed
  domain: ices
  table: hive.ices.stock_assessment_latest
  time_column: year
  not_a_substitute_for: 'Stock-level assessment output for FAO Area 27 (Northeast Atlantic), NOT a Mediterranean
    stock: SURIMI''s own case study is GSA06 and is assessed by CMSY++, which this table does not contain.
    Three traps. (1) The measure columns carry the literal string NA where no value exists; the loader nulls
    it, so a NULL means ''not assessed'', never zero. Spawning biomass is in stock_size where stock_size_description
    is ''SSB''; yield_ssb is NA on 97 per cent of rows and must not be used for SSB. (2) purpose distinguishes
    ''Advice'' (the official assessment) from ''Unofficial'' and other rows. These two filters move the
    headline answer a lot, so state which you used: taking the latest year per stock where both stock_size
    and blim exist, stocks below blim are 32 of 193 with no filter, 25 of 154 restricting to stock_size_description=''SSB'',
    31 of 190 restricting to purpose=''Advice'', and 24 of 151 with both (measured 2026-09-21). The denominator
    is stocks that HAVE a blim, not all 538 stocks in the file. (3) This is the LATEST assessment per stock
    but every stock still has a full per-year series, so ''current'' status is the max year per fish_stock.
    Depletion is stock_size below blim. The low_ and high_ columns (stock_size, fishing_pressure, tbiomass,
    recruitment) are the published confidence intervals on the estimates in this table; quote them only as
    bounds on the estimate for that stock.'
  columns:
    - {name: assessment_key, type: string}
    - {name: fish_stock, type: string}
    - {name: stock_database_id, type: string}
    - {name: stock_key, type: string}
    - {name: purpose, type: string, description: '''Advice'' rows are the official assessment; ''Unofficial'' and other values are not. Filter to Advice unless the question asks otherwise.'}
    - {name: stock_description, type: string}
    - {name: ices_areas, type: string}
    - {name: scient_name, type: string}
    - {name: alpha3_code, type: string}
    - {name: taxonomic_code, type: string}
    - {name: sg_name, type: string}
    - {name: report, type: string}
    - {name: unit_of_recruitment, type: string}
    - {name: recruitment_description, type: string}
    - {name: total_biomass_units, type: string}
    - {name: stock_size_description, type: string, description: 'What stock_size measures for this stock, usually ''SSB''. yield_ssb is the literal string NA on 97 per cent of rows: spawning biomass lives HERE and in stock_size, never in yield_ssb.'}
    - {name: stock_size_units, type: string}
    - {name: catches_landings_units, type: string}
    - {name: fishing_pressure_description, type: string}
    - {name: fishing_pressure_units, type: string}
    - {name: recruitment_age, type: string}
    - {name: recruitment_length, type: string}
    - {name: type_stock, type: string}
    - {name: assessment_year, type: integer}
    - {name: year, type: integer, description: 'Assessment data year. The ''latest'' table is one time SERIES per stock, so ''current status'' means the max year per fish_stock, not the whole table.'}
    - {name: low_recruitment, type: number}
    - {name: recruitment, type: number, additivity: stock}
    - {name: high_recruitment, type: number}
    - {name: low_tbiomass, type: number}
    - {name: tbiomass, type: number, additivity: stock}
    - {name: high_tbiomass, type: number}
    - {name: low_stock_size, type: number, description: Lower bound of the published confidence interval on stock_size.}
    - {name: stock_size, type: number, description: 'The stock-size measure named by stock_size_description, in stock_size_units. For SSB stocks, compare against blim, bpa and msy_b_trigger.', additivity: stock}
    - {name: high_stock_size, type: number, description: Upper bound of the published confidence interval on stock_size.}
    - {name: landings, type: number, additivity: stock}
    - {name: catches, type: number, additivity: stock}
    - {name: discards, type: number, additivity: stock}
    - {name: ibc, type: number, additivity: stock}
    - {name: unallocated_removals, type: number, additivity: stock}
    - {name: yield_ssb, type: number, additivity: stock}
    - {name: low_fishing_pressure, type: number}
    - {name: fishing_pressure, type: number, description: Fishing pressure (usually F) in fishing_pressure_units; compare against fmsy., additivity: stock}
    - {name: high_fishing_pressure, type: number}
    - {name: f_landings, type: number, additivity: stock}
    - {name: f_discards, type: number, additivity: stock}
    - {name: f_ibc, type: number, additivity: stock}
    - {name: f_unallocated, type: number, additivity: stock}
    - {name: flim, type: number}
    - {name: fpa, type: number}
    - {name: blim, type: number, description: Limit biomass reference point. stock_size below blim is the ICES signal of a depleted stock.}
    - {name: bpa, type: number}
    - {name: fmsy, type: number, description: Fishing mortality reference point consistent with MSY.}
    - {name: msy_b_trigger, type: number, description: MSY biomass trigger reference point.}

