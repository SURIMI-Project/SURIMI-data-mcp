[project]
name = "surimi-data-mcp"
version = "1.2.53"
description = "SURIMI-data-mcp: an MCP server that answers questions about SURIMI's fisheries, economic and OECD tables from PostgreSQL (or Trino) and a DuckDB cube, with signed calculation records. SURIMI-model-mcp serves the simulation runs and gridded files."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "trino>=0.330",
    "numpy>=1.26",
    "sqlglot>=26.0",
    # The Dockerfile installs these too.
    "duckdb>=1.0",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "PyJWT[crypto]>=2.8",
    "markdown>=3.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "moto>=5.0",
    "pandas>=2.0",
    "httpx",
]

[tool.pytest.ini_options]
markers = [
    "live: needs a reachable Trino at 127.0.0.1:8081 with the SURIMI hive catalog. CI runs -m 'not live'.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel contains only the surimi_data_mcp package.
[tool.hatch.build.targets.wheel]
packages = ["surimi_data_mcp"]
